name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest sqlalchemy python-dateutil
      - run: python -m compileall -q backend/app
      - run: python -m pytest -q backend/tests
